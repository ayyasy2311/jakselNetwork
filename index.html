<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="description" content="Peta interaktif South Jakarta (Jaksel) menampilkan jalan, pusat kesehatan, dan rumah sakit">
        <meta name="theme-color" content="#ffffff">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- Stylesheets -->
        <link rel="stylesheet" href="resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" href="resources/photon-geocoder-autocomplete.min.css">
        <link rel="stylesheet" href="resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="resources/qgis2web.css">
        <link rel="stylesheet" href="resources/custom-styles.css">
        
        <title>Jaksel Network Map - Interactive South Jakarta Map</title>
    </head>
    <body>
        <div id="map" role="application" aria-label="Interactive map of South Jakarta showing roads, clinics, and hospitals">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer" aria-label="Close popup"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="resources/qgis2web_expressions.js" defer></script>
        <script src="resources/functions.js" defer></script>
        <script src="resources/ol.js"></script>
        <script src="resources/ol-layerswitcher.js" defer></script>
        <script src="resources/photon-geocoder-autocomplete.min.js" defer></script>
        <script src="resources/olms.js" defer></script>
        <script src="resources/Autolinker.min.js" defer></script>
        <script src="resources/qgis2web.js" defer></script>
        
        <!-- Layer Data -->
        <script src="layers/jalan_jaksel_1.js" defer></script>
        <script src="layers/puskesmas_jaksel_2.js" defer></script>
        <script src="layers/rumahsakit_jaksel_3.js" defer></script>
        
        <!-- Layer Styles -->
        <script src="styles/jalan_jaksel_1_style.js" defer></script>
        <script src="styles/puskesmas_jaksel_2_style.js" defer></script>
        <script src="styles/rumahsakit_jaksel_3_style.js" defer></script>
        
        <!-- Main Layers Configuration -->
        <script src="layers/layers.js" defer></script>
    </body>
</html>
